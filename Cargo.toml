[package]
name = "auth-header"
version = "0.1.0"
edition = "2024"
description = "Resolve credentials into HTTP authorization header values"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
